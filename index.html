<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영아 간호 CBT</title><style>
:root{--navy:#12263f;--blue:#1769aa;--green:#137a52;--red:#bd3544;--bg:#f3f6f9;--line:#d7e1eb;--muted:#627386}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172432;font-family:system-ui,'Apple SD Gothic Neo','NanumGothic',sans-serif;line-height:1.6}header{background:var(--navy);color:white}.header{max-width:980px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:18px}.title small{display:block;font-size:12px;opacity:.75;font-weight:400}.scorebox{display:flex;gap:22px;font-size:13px}.scorebox b{font-size:19px;color:#ade1ff;margin-left:4px}main{max-width:880px;margin:28px auto;padding:0 16px}.notice{background:#fff6db;border-left:4px solid #e1a31b;border-radius:6px;padding:12px 15px;margin-bottom:16px;font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 16px #17324d12}.bar{height:7px;background:#e2eaf1}.bar i{display:block;background:var(--green);height:100%;width:0;transition:.2s}.meta{padding:15px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.tag{background:var(--blue);color:#fff;border-radius:20px;padding:3px 10px;font-weight:700}.question{padding:27px 27px 14px;font-weight:750;font-size:20px;white-space:pre-line;letter-spacing:-.25px}.options{display:grid;gap:9px;padding:0 21px 22px}.option{background:#fff;border:1px solid #c9d5e0;border-radius:7px;text-align:left;padding:14px 15px;font:inherit;color:inherit;display:flex;gap:12px;cursor:pointer}.option:hover:not(:disabled){background:#f3f9ff;border-color:var(--blue)}.option:disabled{cursor:default}.num{color:var(--blue);font-weight:800;min-width:20px}.correct{background:#eaf8f0!important;border-color:var(--green)!important}.wrong{background:#fff0f2!important;border-color:var(--red)!important}.feedback{display:none;white-space:pre-line;margin:0 26px 22px;padding:15px;border-radius:7px;font-size:14px}.feedback.good{display:block;background:#eaf8f0;color:#0f613d}.feedback.bad{display:block;background:#fff0f2;color:#972634}.actions{text-align:right;padding:0 26px 25px}button.next,button.restart{display:none;background:var(--blue);border:0;border-radius:7px;color:#fff;font:inherit;font-weight:750;padding:12px 19px;cursor:pointer}.finish{display:none;text-align:center;padding:46px 20px}.finish h1{margin:0;color:var(--navy)}.finish p{color:var(--muted)}.finish .restart{display:inline-block}.foot{color:#748596;font-size:12px;text-align:center}@media(max-width:520px){main{margin-top:18px}.question{padding:21px 18px 12px;font-size:18px}.options{padding:0 13px 18px}.feedback{margin:0 18px 18px}.actions{padding:0 18px 19px}}
</style></head><body><header><div class="header"><div class="title">국가고시 CBT 실전학습<small>아동간호학 · 영아 간호</small></div><div class="scorebox"><span>정답 <b id="score">0</b>/20</span><span>풀이 <b id="solved">0</b></span></div></div></header><main><div class="notice">선택 즉시 <b>정답</b>이 표시됩니다. 처음에는 중복 없이 무작위 출제되며, 오답 문항은 보기를 섞어 다시 출제합니다. 오답과 공통 키워드가 있는 미완료 문항을 우선 제공합니다. <b>서로 다른 20문항 정답</b> 달성 시 종료됩니다.</div><section class="card" id="exam"><div class="bar"><i id="bar"></i></div><div class="meta"><span class="tag" id="label">문제</span><span id="state">문제은행 무작위 출제</span></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="next" id="next" onclick="nextQ()">다음 문제 →</button></div></section><section class="card finish" id="finish"><h1>🎉 서로 다른 20문항 정답 달성!</h1><p id="summary"></p><button class="restart" onclick="start()">새 학습 시작</button></section><p class="foot">학습용 CBT · 응시 결과는 현재 브라우저에서만 표시됩니다.</p></main><script>
